name: MessageMe *
description: 'MessageMe was a mobile messaging application built to explore expressive, fun online
  communication, and a portfolio company of GV (Google Ventures) in the consumer sector. The MessageMe
  team was acquired by Yahoo, and the product was shut down: users could access messages until November 7,
  2014, after which accounts and personal information were erased. The messageme.com domain now serves
  only the shutdown announcement. Enrichment on 2026-07-20 confirmed the company is defunct with no live
  API, developer portal, documentation, SDKs, or event surface to catalog.'
